name: Refresh market data

on:
  schedule:
    # Every 30 minutes, offset from the hour/half-hour (was '*/30 * * * *').
    # GitHub's own docs say scheduled runs can be delayed or dropped under
    # load, "especially at the start of every hour" — exactly the round
    # minute marks the old schedule fired on. Confirmed happening for real
    # on 2026-08-17: market_data.json's own generated_at sat frozen for
    # ~2h53m (from Mon 07:42 SGT through mid-morning) while the Actions
    # page still showed runs "succeeding" — the workflow just wasn't being
    # triggered at all during that stretch. Firing 6 and 36 minutes past
    # the hour instead avoids the busiest scheduling window and should
    # cut how often this happens — GitHub gives no guarantee it reaches
    # zero on the free tier, so the app itself now also warns David
    # directly (via generated_at) if this file goes stale again, rather
    # than silently showing "Live" with hours-old prices.
    - cron: '6,36 * * * *'
  # Lets you trigger it by hand from the Actions tab, e.g. to test it once
  # right after setting this up, without waiting for the schedule.
  workflow_dispatch: {}

# Needed so this workflow can commit the updated market_data.json back into
# the repo using the built-in token — no extra secrets or personal access
# tokens required.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python update_market_data.py

      - name: Commit updated market_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh market data"
            git push
          fi
