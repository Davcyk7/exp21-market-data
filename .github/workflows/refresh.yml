name: Refresh market data

on:
  schedule:
    # v43 (leaving Yahoo Finance) loosened this from every 15 minutes to
    # roughly hourly — Marketstack's Basic plan was END-OF-DAY data only
    # and metered (10,000 requests/month).
    #
    # v46 (David's personal-use pivot, back to Yahoo Finance, 2026-09-30):
    # reverted to the original ~15-min cadence, offset from the round hour
    # mark (GitHub's busiest scheduling window) — this is the exact
    # original 6/21/36/51 offset this project used before v43. yfinance has
    # no metered quota to protect and Yahoo's data is genuinely intraday,
    # so nothing is bought by refreshing any less often than this. Still
    # paired with the Cloudflare Worker's own independent Cron Trigger as a
    # genuinely redundant backstop (kept 5 minutes after this one) — see
    # the main Vestly repo's README "Keeping market data fresh" section.
    - cron: '6,21,36,51 * * * *'
  # Lets you trigger it by hand from the Actions tab, e.g. to test it once
  # right after setting this up, without waiting for the schedule. Also
  # what the Cloudflare Worker above calls via the REST API, on its own
  # independent schedule.
  workflow_dispatch:

# Needed so this workflow can commit the updated market_data.json back into
# the repo using the built-in token — no extra secrets or personal access
# tokens required for this permission. v46: unlike the Marketstack era,
# update_market_data.py itself now needs no API key/secret at all — Yahoo
# Finance's unofficial endpoints (called via yfinance) require none.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # v46: no env vars needed here anymore — Yahoo Finance's unofficial
      # endpoints (called via yfinance) require no API key, unlike the
      # MARKETSTACK_API_KEY secret this step used to pass through. If you
      # previously added that repository secret, it's safe to delete from
      # this repo's Settings -> Secrets and variables -> Actions — nothing
      # here reads it anymore.
      - run: python update_market_data.py

      - name: Commit updated market_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh market data"
            git push
          fi
