name: Refresh market data

on:
  schedule:
    # v43 (leaving Yahoo Finance): loosened from every 15 minutes back to
    # roughly hourly, on purpose — Marketstack's Basic plan is END-OF-DAY
    # data only (not intraday/real-time), so refreshing more often than
    # once per trading-day close was never buying anything, and Marketstack
    # is METERED (10,000 requests/month), unlike the old free/unlimited
    # yfinance pull this replaced. Still offset from the round hour mark
    # (GitHub's busiest scheduling window, same reasoning as the old
    # 6/21/36/51 offset), and still paired with the Cloudflare Worker's own
    # independent Cron Trigger below as a genuinely redundant backstop —
    # see the main Vestly repo's README "Keeping market data fresh" and
    # "Marketstack quota budget" sections for the full reasoning and the
    # actual monthly request math this cadence is built around.
    - cron: '14 * * * *'
  # Lets you trigger it by hand from the Actions tab, e.g. to test it once
  # right after setting this up, without waiting for the schedule. Also
  # what the Cloudflare Worker above calls via the REST API, on its own
  # independent hourly schedule.
  workflow_dispatch: {}

# Needed so this workflow can commit the updated market_data.json back into
# the repo using the built-in token — no extra secrets or personal access
# tokens required for THIS permission (a separate secret, MARKETSTACK_API_KEY
# below, is required for the script itself to fetch real prices).
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python update_market_data.py
        env:
          # v43: set once via this repo's own Settings -> Secrets and
          # variables -> Actions -> "New repository secret" (name must be
          # exactly MARKETSTACK_API_KEY) — your real key from marketstack.com's
          # dashboard. Never committed to this file or anywhere else in the
          # repo. Without it, update_market_data.py exits immediately
          # without touching market_data.json (see its own docstring).
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}

      - name: Commit updated market_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh market data"
            git push
          fi
